openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: profile
    description: Authenticated student profile
  - name: teamup
    description: Projects, applications, discovery, and dashboard data
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /profile:
    get:
      operationId: getMyProfile
      tags: [profile]
      summary: Get the signed-in student's profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profile found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Profile has not been created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Supabase is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: saveMyProfile
      tags: [profile]
      summary: Create or update the signed-in student's profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: Profile saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          description: Invalid profile fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Supabase is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /projects:
    get:
      operationId: getProjects
      tags: [teamup]
      summary: Discover projects that are currently recruiting
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: q
          schema: { type: string, maxLength: 120 }
        - in: query
          name: category
          schema: { type: string, maxLength: 80 }
        - in: query
          name: skill
          schema: { type: string, maxLength: 80 }
      responses:
        "200":
          description: Matching projects
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Project" }
    post:
      operationId: createProject
      tags: [teamup]
      summary: Create a project and add its owner as a member atomically
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectInput" }
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400":
          description: Invalid project fields
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /projects/{projectId}:
    patch:
      operationId: updateProject
      tags: [teamup]
      summary: Update a project owned by the signed-in student
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectInput" }
      responses:
        "200":
          description: Project updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "404":
          description: Project not found or not owned by the caller
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /projects/{projectId}/close:
    post:
      operationId: closeProject
      tags: [teamup]
      summary: Close recruitment for a project owned by the signed-in student
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Project closed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
  /projects/{projectId}/applications:
    post:
      operationId: submitApplication
      tags: [teamup]
      summary: Submit an application to a recruiting project
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicationInput" }
      responses:
        "201":
          description: Application submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }
        "409":
          description: Project is unavailable or an application already exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /applications/{applicationId}/accept:
    post:
      operationId: acceptApplication
      tags: [teamup]
      summary: Accept an application and add its student as a member atomically
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: applicationId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Application accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }
        "409":
          description: Application is not pending or project cannot accept members
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /applications/{applicationId}/reject:
    post:
      operationId: rejectApplication
      tags: [teamup]
      summary: Reject an application for a project owned by the caller
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: applicationId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Application rejected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }
  /applications/{applicationId}/withdraw:
    post:
      operationId: withdrawApplication
      tags: [teamup]
      summary: Withdraw the caller's pending application
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: applicationId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Application withdrawn
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }
  /students:
    get:
      operationId: getStudents
      tags: [teamup]
      summary: Search the signed-in student directory
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: q
          schema: { type: string, maxLength: 120 }
        - in: query
          name: skill
          schema: { type: string, maxLength: 80 }
      responses:
        "200":
          description: Matching public student profiles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Student" }
  /dashboard:
    get:
      operationId: getDashboard
      tags: [teamup]
      summary: Load the signed-in student's projects, applications, and private team rosters
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardData" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Skill:
      type: string
      enum:
        - Frontend development
        - Backend development
        - UI/UX design
        - Product design
        - Product management
        - User research
        - Data science
        - Machine learning
        - Mobile development
        - Cloud and DevOps
        - Hardware and IoT
        - Game development
        - Writing and content
        - Marketing
        - Community building
    Profile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        college:
          type: string
        bio:
          type: string
        skills:
          type: array
          items:
            $ref: "#/components/schemas/Skill"
        preferredRole:
          type: string
        hoursAvailablePerWeek:
          type: integer
        portfolioUrl:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - college
        - bio
        - skills
        - preferredRole
        - hoursAvailablePerWeek
        - portfolioUrl
        - createdAt
        - updatedAt
    ProfileInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        college:
          type: string
          minLength: 1
          maxLength: 160
        bio:
          type: string
          maxLength: 500
        skills:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Skill"
        preferredRole:
          type: string
          minLength: 1
          maxLength: 80
        hoursAvailablePerWeek:
          type: integer
          minimum: 1
          maximum: 168
        portfolioUrl:
          type: ["string", "null"]
          format: uri
          maxLength: 300
      required:
        - name
        - college
        - bio
        - skills
        - preferredRole
        - hoursAvailablePerWeek
        - portfolioUrl
    Project:
      type: object
      properties:
        id: { type: string, format: uuid }
        ownerId: { type: string, format: uuid }
        ownerName: { type: string }
        title: { type: string }
        description: { type: string }
        category: { type: string }
        requiredSkills: { type: array, items: { type: string } }
        openRoles: { type: array, items: { type: string } }
        totalCapacity: { type: integer }
        memberCount: { type: integer }
        deadline: { type: string, format: date }
        status: { type: string, enum: [recruiting, closed] }
        repositoryUrl: { type: ["string", "null"], format: uri }
        demoUrl: { type: ["string", "null"], format: uri }
        matchedSkills: { type: array, items: { type: string } }
        matchPercent: { type: ["integer", "null"], minimum: 0, maximum: 100 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, ownerId, ownerName, title, description, category, requiredSkills, openRoles, totalCapacity, memberCount, deadline, status, repositoryUrl, demoUrl, matchedSkills, matchPercent, createdAt, updatedAt]
    ProjectInput:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 140 }
        description: { type: string, minLength: 1, maxLength: 4000 }
        category: { type: string, minLength: 1, maxLength: 80 }
        requiredSkills: { type: array, maxItems: 12, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 80 } }
        openRoles: { type: array, minItems: 1, maxItems: 12, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 100 } }
        totalCapacity: { type: integer, minimum: 2, maximum: 100 }
        deadline: { type: string, format: date }
        repositoryUrl: { type: ["string", "null"], format: uri, maxLength: 500 }
        demoUrl: { type: ["string", "null"], format: uri, maxLength: 500 }
      required: [title, description, category, requiredSkills, openRoles, totalCapacity, deadline, repositoryUrl, demoUrl]
    ApplicationInput:
      type: object
      properties:
        selectedRole: { type: string, minLength: 1, maxLength: 100 }
        introduction: { type: string, minLength: 1, maxLength: 2000 }
      required: [selectedRole, introduction]
    Application:
      type: object
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        projectTitle: { type: string }
        applicantId: { type: string, format: uuid }
        applicantName: { type: string }
        applicantCollege: { type: string }
        selectedRole: { type: string }
        introduction: { type: string }
        status: { type: string, enum: [pending, accepted, rejected, withdrawn] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, projectId, projectTitle, applicantId, applicantName, applicantCollege, selectedRole, introduction, status, createdAt, updatedAt]
    Student:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        college: { type: string }
        bio: { type: string }
        skills: { type: array, items: { type: string } }
        preferredRole: { type: string }
        hoursAvailablePerWeek: { type: integer }
        portfolioUrl: { type: ["string", "null"], format: uri }
      required: [id, name, college, bio, skills, preferredRole, hoursAvailablePerWeek, portfolioUrl]
    TeamMember:
      type: object
      properties:
        userId: { type: string, format: uuid }
        name: { type: string }
        role: { type: string }
        joinedAt: { type: string, format: date-time }
      required: [userId, name, role, joinedAt]
    ProjectRoster:
      type: object
      properties:
        project: { $ref: "#/components/schemas/Project" }
        members:
          type: array
          items: { $ref: "#/components/schemas/TeamMember" }
      required: [project, members]
    DashboardData:
      type: object
      properties:
        ownedProjects:
          type: array
          items: { $ref: "#/components/schemas/Project" }
        joinedProjects:
          type: array
          items: { $ref: "#/components/schemas/Project" }
        submittedApplications:
          type: array
          items: { $ref: "#/components/schemas/Application" }
        receivedApplications:
          type: array
          items: { $ref: "#/components/schemas/Application" }
        rosters:
          type: array
          items: { $ref: "#/components/schemas/ProjectRoster" }
      required: [ownedProjects, joinedProjects, submittedApplications, receivedApplications, rosters]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

