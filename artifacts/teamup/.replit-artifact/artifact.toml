kind = "web"
previewPath = "/"
title = "TeamUp"
description = "TeamUp helps students create projects, discover collaborators, apply for roles, manage applications, and view private team rosters with Supabase Auth and row-level database security."
version = "1.0.0"
id = "artifacts/teamup"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18832

[services.development]
run = "pnpm --filter @workspace/teamup run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/teamup", "run", "build" ]
serve = "static"
publicDir = "artifacts/teamup/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18832"
BASE_PATH = "/"
